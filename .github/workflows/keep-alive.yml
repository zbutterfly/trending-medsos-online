name: keep-alive

# GitHub menonaktifkan cron workflow di repo tanpa aktivitas commit ≥60 hari.
# run_once.py tidak pernah commit ke repo ini (semua upload pergi ke HF via
# API) — tanpa bump bulanan ini, schedule refresh-data akan mati diam-diam
# ~2 bulan setelah commit terakhir. Lihat: docs/DEPLOY-HF-SPACES.md
on:
  schedule:
    - cron: "17 3 1 * *"   # tanggal 1 tiap bulan (menit off-peak)
  workflow_dispatch: {}     # tombol "Run workflow" manual

permissions:
  contents: write

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Commit aktivitas bulanan (anti auto-disable cron)
        run: |
          echo "keep-alive $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .last-activity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-activity
          git commit -m "chore: keep-alive activity bump" || echo "nothing to commit"
          git push
