name: refresh-data

on:
  schedule:
    - cron: "*/10 * * * *"   # tiap 10 menit (GitHub minimum 5 menit; bisa telat saat peak)
  workflow_dispatch: {}       # tombol "Run workflow" manual

permissions:
  contents: read
  actions: write   # gh cache delete + gh workflow run (rantai siklus)

concurrency:
  group: refresh
  # false = run berantai berikutnya MENUNGGU run ini selesai (post-save DB
  # harus sempat jalan); true akan membatalkan post-save saat run baru datang.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 12 menit: siklus + sleep 360 dgn dispatch di ~menit ke-9 — jangan bunuh
    # job sebelum rantai selesai.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install deps (slim)
        run: pip install -r requirements-runtime.txt

      - name: Restore trending.db (kunci run SEBELUMNYA)
        uses: actions/cache/restore@v4
        with:
          path: var/trending.db
          # Pelajaran 9 Okt (bukti run #50: new=1080 = DB fresh lagi): skema
          # kunci-tetap + gh-cache-delete ber-RACE — dispatch rantai menembak
          # run berikutnya SEBELUM post-save selesai, run baru restore saat
          # entri sedang dihapus/di-upload → miss. Skema v6: kunci unik per
          # run_number; rantai sequential → run N selalu restore kunci N-1
          # (eksak, tanpa restore-keys, tanpa delete). Miss = DB segar sekali
          # saja, lalu rantai normal.
          key: trending-db-v6-${{ github.run_number - 1 }}

      - name: Run one fetch cycle + publish to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HYPERLIQUID_WATCHLIST: ${{ secrets.HYPERLIQUID_WATCHLIST }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python scripts/run_once.py

      # Simpan DB SEBELUM dispatch rantai — urutan inilah yang memutus race
      # (dulu save terjadi di post-step SETELAH run berikutnya di-dispatch).
      - name: Simpan trending.db (kunci run INI)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: var/trending.db
          key: trending-db-v6-${{ github.run_number }}

      # Canary: bila siklus ini gagal ATAU pipeline macet (kuota Actions habis
      # / workflow disabled / upload HF gagal), dataset tidak ter-update.
      # Gagalkan job supaya GitHub mengirim email failure — deteksi paling
      # murah, tanpa layanan monitoring eksternal (Space privat anti-probe).
      - name: Canary — dataset harus segar (<30 menit)
        if: always()
        run: |
          python - <<'EOF'
          import json, sys, time, urllib.request
          URL = "https://huggingface.co/datasets/Jetbard/tmx-feed-g9nh5j/resolve/main/signals.json"
          try:
              req = urllib.request.Request(URL, headers={"User-Agent": "canary"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.load(r)
          except Exception as e:
              print(f"canary: GAGAL fetch dataset: {e}")
              sys.exit(1)
          age = (time.time() * 1000 - int(d.get("generated_at") or 0)) / 60000
          print(f"canary: data berumur {age:.1f} menit")
          if age > 30:
              print(f"canary: DATA STALE — pipeline tidak sehat ({age:.0f} menit).")
              sys.exit(1)
          print("canary: OK — data segar.")
          EOF

      # Cadence: cron */10 GitHub MIRIP throttled (bukti: 18 run dalam 3 hari,
      # gap 6-7 jam) — high-frequency schedule sering delayed/dropped. Rantai
      # self-dispatch menjaga irama ~10 menit; cron tetap jadi backstop bila
      # rantai putus (run gagal total). sleep 360 + durasi run ≈ 9-11 menit.
      - name: Antrikan siklus berikutnya (rantai self-dispatch)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 360
          gh workflow run refresh.yml --repo "$GITHUB_REPOSITORY" || true
